        <script>
            //1. 전역변수 - 재선언시 덮어씀
            var global; // 선언 - 자바스크립트 엔진 변수명 알려주기
            console.log(global); // undifined
            global=123; // 사용
            document.write(global);
        </script>
    </div>
    <h2 class="card-header">step2 : var, let, const</h2>
    <div class="card-body">
        <script>
        //1.Var
            var global=10; console.log(glodbal);
            var global=20; console.log(glodbal);
        //2. Let - 변수 중복선언 불가능
            let local1=10; console.log(local1);
                local1=20; console.log(local1);
        //3. Const - 상수
            const const1=30; console.log(const1);
                  const1=40;

   <div class="container card my-3">
    <h2 class="card-header">자료형 실습</h2>
    <div class="card-body">
        <script>
            let data1;           console.log(data1);
            data1=10;            console.log(data1);
            data1=3.14;          console.log(data1);
            data1="abc";         console.log(data1);
            data1=["sally",7];   console.log(data1);
            data1={};            console.log(data1);
            data1=function(){};  console.log(data1);
                                 console.log(typeof(data1));
            data1=10;
            console.log(data1 + Number("10")); // 10+"10"이 20이 나오면 좋겠다               
        </script>
