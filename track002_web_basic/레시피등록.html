<%@ page contentType="text/html;charset=UTF-8" language="java" %>
<%@ taglib uri="http://java.sun.com/jsp/jstl/core" prefix="c" %>
<html>
<head>
  <style>
    body {
  font-family: 'Noto Sans KR', sans-serif;
  background: #fff;
  margin: 0;
  padding: 0;
}

.container {
  max-width: 800px;
  margin: 40px auto;
  padding: 20px;
}

h1 {
  font-size: 24px;
  margin-bottom: 10px;
}

.subtitle {
  color: #666;
  margin-bottom: 30px;
}

label {
  display: block;
  margin-top: 20px;
  font-weight: bold;
}

input, select, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border: 1px solid #ccc;
  border-radius: 6px;
}

.hint {
  font-size: 12px;
  color: #999;
}

.dynamic-section {
  margin-top: 30px;
}

.dynamic-section button {
  margin-top: 10px;
  padding: 6px 12px;
  background: orange;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

.button-group {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 30px;
}

.cancel-btn {
  padding: 10px 20px;
  background: #eee;
  text-decoration: none;
  border-radius: 6px;
  color: #333;
}

.submit-btn {
  padding: 10px 20px;
  background: orange;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

  </style>
  <title>새 레시피 작성</title>
  <link rel="stylesheet" href="/css/recipe.css">
</head>
<body>
  <div class="container">
    <h1>새 레시피 작성</h1>
    <p class="subtitle">나만의 레시피를 공유해보세요</p>

    <form action="/recipe/save" method="post">
      <!-- 제목 -->
      <label for="title">레시피 제목 *</label>
      <input type="text" id="title" name="title" placeholder="예: 김치찌개" required>

      <!-- 카테고리 -->
      <label for="category">카테고리 *</label>
      <select id="category" name="category" required>
        <option value="한식">한식</option>
        <option value="양식">양식</option>
        <option value="중식">중식</option>
        <option value="일식">일식</option>
        <option value="디저트">디저트</option>
        <option value="건강식">건강식</option>
        <option value="기타">기타</option>
      </select>

      <!-- 난이도 -->
      <label for="difficulty">난이도 *</label>
      <select id="difficulty" name="difficulty" required>
        <option value="쉬움">쉬움</option>
        <option value="보통">보통</option>
        <option value="어려움">어려움</option>
      </select>

      <!-- 조리 시간 -->
      <label for="cookTime">조리 시간 (분) *</label>
      <input type="number" id="cookTime" name="cookTime" min="1" placeholder="30" required>

      <!-- 인분 -->
      <label for="servings">인분 *</label>
      <input type="number" id="servings" name="servings" min="1" placeholder="2" required>

      <!-- 이미지 URL -->
      <label for="image">이미지 URL (선택사항)</label>
      <input type="url" id="image" name="image" placeholder="https://example.com/image.jpg">
      <p class="hint">이미지 URL을 입력하지 않으면 기본 이미지가 사용됩니다.</p>

      <!-- 설명 -->
      <label for="description">레시피 설명 *</label>
      <textarea id="description" name="description" rows="3" placeholder="이 레시피에 대한 간단한 설명을 입력하세요" required></textarea>

      <!-- 재료 -->
      <div class="dynamic-section" id="ingredients-section">
        <label>재료 *</label>
        <button type="button" onclick="addIngredient()">+ 재료 추가</button>
        <div id="ingredients-list">
          <input type="text" name="ingredients" placeholder="예: 돼지고기 300g" required>
        </div>
      </div>

      <!-- 조리 방법 -->
      <div class="dynamic-section" id="instructions-section">
        <label>조리 방법 *</label>
        <button type="button" onclick="addInstruction()">+ 단계 추가</button>
        <div id="instructions-list">
          <textarea name="instructions" rows="2" placeholder="조리 단계 1" required></textarea>
        </div>
      </div>

      <!-- 버튼 -->
      <div class="button-group">
        <a href="/" class="cancel-btn">취소</a>
        <button type="submit" class="submit-btn">레시피 등록</button>
      </div>
    </form>
  </div>

  <script>
    function addIngredient() {
      const list = document.getElementById("ingredients-list");
      const input = document.createElement("input");
      input.type = "text";
      input.name = "ingredients";
      input.placeholder = "재료 추가";
      list.appendChild(input);
    }

    function addInstruction() {
      const list = document.getElementById("instructions-list");
      const textarea = document.createElement("textarea");
      textarea.name = "instructions";
      textarea.rows = 2;
      textarea.placeholder = `조리 단계 ${list.children.length + 1}`;
      list.appendChild(textarea);
    }
  </script>
</body>
</html>
