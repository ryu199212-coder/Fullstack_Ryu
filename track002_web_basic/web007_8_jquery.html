    <script>
      window.addEventListener("load", function(){
       let ps = document.querySelectorAll("p");
       console.log(ps);
      });

      //$ == jquery $(대상) 
      $(function(){
        //1. 일반태그
        $("p").css({"color":"blue", "fontSize":"15px"});
        //2. #아이디
        $("#hello").css({"backgroundColor":"black", "color":"white"});
        //3. .클래스
        $(".greeting").css({"fontSize":"20px", "textAlign":"censter", "textDecoration":"underline"});
        //4. 자식태그
        $("ul > li").css({"color":"gold"});
        //5. 첫번째
        $("div:first").css({"border":"10px dotted black"})
        $(".item").css({"cursir":"pointer"})
        $(".item").on("click", function(){
          $(".item").prev().css({"textAlign":"center"}); //6. 이전
          $(".item").next().css({"textAlign":"right"});  //7. 다음
        
        });  
          $(".card").on("mouseenter", function(){
            console.log("1")
            $(this).css({"backgroundColor":"green", "color":"white"});
          }).on("mouseleave", function(){
            $(this).css({"backgroundColor":"white", "color":"black"});
        });

      });
    </script>
